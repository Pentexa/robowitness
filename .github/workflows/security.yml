name: Security

# Security scanning for RoboWitness.
# - CodeQL: static analysis for Python and JavaScript/TypeScript.
# - Dependency Review: blocks PRs that introduce high-severity vulnerable deps.
# - Dependency Audit: pip-audit + npm audit reports (informational; reports are
#   uploaded as artifacts and never silently ignored — triage happens in the
#   weekly review, and Dependabot opens the fix PRs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: pip-audit (backend environment)
        continue-on-error: true
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --format json --output ../pip-audit.json || true
          pip-audit || true

      - name: npm audit (web dependencies)
        continue-on-error: true
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --json > ../npm-audit.json || true
          npm audit --audit-level=high || true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 30
