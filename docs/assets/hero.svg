<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">RoboWitness — Independent verification for AI-generated robotics policies</title>
  <desc id="heroDesc">Dark hero banner with the RoboWitness wordmark, the core invariant, and a top-down simulation viewport showing a robot, a delayed sensor cone, an obstacle, a goal, and a sealed evidence hash.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D18"/>
      <stop offset="0.55" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#0B1A2B"/>
    </linearGradient>

    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>

    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1A2C"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>

    <linearGradient id="sensorFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLime" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A3E635" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>

    <pattern id="panelGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E3A4A" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="744" y="54" width="396" height="312" rx="22"/>
    </clipPath>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.30"/>
  <circle cx="840" cy="120" r="360" fill="url(#glowCyan)"/>
  <circle cx="1130" cy="350" r="280" fill="url(#glowLime)"/>
  <circle cx="1090" cy="50" r="190" fill="none" stroke="#22D3EE" stroke-opacity="0.06" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left: identity -->
  <g>
    <rect x="72" y="62" width="360" height="34" rx="17" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.30"/>
    <circle cx="90" cy="79" r="4" fill="#22D3EE" filter="url(#softGlow)"/>
    <text x="106" y="84" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.8" fill="#7DD3FC">INDEPENDENT VERIFICATION ENGINE</text>

    <text x="70" y="192" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2">
      <tspan fill="#F8FAFC">Robo</tspan><tspan fill="url(#titleAccent)">Witness</tspan>
    </text>
    <rect x="72" y="210" width="96" height="4" rx="2" fill="url(#titleAccent)"/>

    <text x="72" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#CBD5E1">The AI proposes. The simulator executes.</text>
    <text x="72" y="286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#CBD5E1">The independent oracle decides. The evidence explains.</text>

    <!-- Capability pills -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
      <rect x="72" y="338" width="196" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="90" cy="356" r="3.5" fill="#22D3EE"/>
      <text x="102" y="361">60 Hz deterministic</text>

      <rect x="280" y="338" width="216" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="298" cy="356" r="3.5" fill="#A3E635"/>
      <text x="310" y="361">5 verification gates</text>

      <rect x="508" y="338" width="184" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <path d="M524 352v-4a4 4 0 0 1 8 0v4" fill="none" stroke="#67E8F9" stroke-width="1.6"/>
      <rect x="522" y="352" width="12" height="9" rx="2" fill="#67E8F9"/>
      <text x="542" y="361">SHA-256 sealed</text>
    </g>
  </g>

  <!-- Right: simulation viewport -->
  <g filter="url(#panelShadow)">
    <rect x="744" y="54" width="396" height="312" rx="22" fill="url(#panelFill)" stroke="#1E3A4A" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="744" y="94" width="396" height="272" fill="url(#panelGrid)" opacity="0.45"/>

    <!-- Header -->
    <rect x="744" y="54" width="396" height="40" fill="#0A1524"/>
    <circle cx="770" cy="74" r="3.5" fill="#F87171" fill-opacity="0.85"/>
    <circle cx="786" cy="74" r="3.5" fill="#FBBF24" fill-opacity="0.85"/>
    <circle cx="802" cy="74" r="3.5" fill="#34D399" fill-opacity="0.85"/>
    <text x="820" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">RW-REF-001</text>
    <rect x="1060" y="63" width="56" height="22" rx="11" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.25"/>
    <text x="1074" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#67E8F9">60 Hz</text>
    <line x1="744" y1="94" x2="1140" y2="94" stroke="#1E293B"/>

    <!-- Warehouse walls -->
    <line x1="770" y1="118" x2="1000" y2="118" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="1080" y1="118" x2="1080" y2="190" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="790" y1="318" x2="1110" y2="318" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="768" y1="160" x2="768" y2="228" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

    <!-- Sensor scan arcs -->
    <g fill="none" stroke="#22D3EE" stroke-opacity="0.14" stroke-dasharray="3 9">
      <circle cx="820" cy="250" r="70"/>
      <circle cx="820" cy="250" r="110"/>
      <circle cx="820" cy="250" r="150"/>
    </g>

    <!-- Delayed sensor cone -->
    <path d="M820 250 L1040 185 A229 229 0 0 1 1040 315 Z" fill="url(#sensorFill)" opacity="0.55"/>

    <!-- Planned path -->
    <path d="M842 244 C900 215 940 190 985 180 S1020 170 1032 166" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7" opacity="0.85" marker-end="url(#arrow)"/>

    <!-- Goal -->
    <g>
      <circle cx="1050" cy="155" r="18" fill="#A3E635" fill-opacity="0.08" stroke="#A3E635" stroke-width="2"/>
      <circle cx="1050" cy="155" r="8" fill="none" stroke="#A3E635" stroke-width="2"/>
      <circle cx="1050" cy="155" r="2.5" fill="#A3E635"/>
      <text x="1036" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#A3E635">GOAL</text>
    </g>

    <!-- Obstacle -->
    <g>
      <circle cx="950" cy="240" r="34" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-dasharray="4 6"/>
      <circle cx="950" cy="240" r="16" fill="#FB7185" filter="url(#softGlow)"/>
      <circle cx="950" cy="240" r="6" fill="#BE123C"/>
      <text x="920" y="290" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#FB7185">OBSTACLE</text>
    </g>

    <!-- Robot -->
    <g>
      <rect x="796" y="234" width="8" height="32" rx="4" fill="#155E75"/>
      <rect x="836" y="234" width="8" height="32" rx="4" fill="#155E75"/>
      <circle cx="820" cy="250" r="20" fill="#0B2A3A" stroke="#22D3EE" stroke-width="2.5"/>
      <circle cx="820" cy="250" r="7" fill="none" stroke="#22D3EE" stroke-opacity="0.45"/>
      <line x1="820" y1="250" x2="846" y2="238" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="848" cy="237" r="2.5" fill="#67E8F9"/>
      <text x="799" y="298" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#22D3EE">POLICY</text>
      <text x="776" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#64748B">450 ms latency</text>
    </g>

    <!-- Evidence status bar -->
    <rect x="744" y="330" width="396" height="36" fill="#07111F"/>
    <line x1="744" y1="330" x2="1140" y2="330" stroke="#1E293B"/>
    <circle cx="766" cy="348" r="3.5" fill="#34D399"/>
    <text x="778" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#86EFAC">EVIDENCE SEALED</text>
    <text x="1000" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#475569">sha256:9f2c&#8230;a71e</text>
  </g>
</svg>
